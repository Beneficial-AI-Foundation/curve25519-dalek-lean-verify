name: Warning Diff Comment
# Posts the warning-diff PR comment after the Warning Diff workflow
# completes. Because workflow_run always executes in the context of the
# *base* repository, the GITHUB_TOKEN has write access even for fork PRs.

on:
  workflow_run:
    workflows: ["Warning Diff"]
    types: [completed]

jobs:
  comment:
    name: Post Warning Diff Comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Download warning diff artifact
        uses: actions/download-artifact@v4
        with:
          name: warning-diff-comment
          path: warning-diff-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number and diff flag
        id: pr
        run: |
          PR_NUM=$(cat warning-diff-comment/pr-number.txt)
          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUM"
            exit 1
          fi
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "has_diff=$(cat warning-diff-comment/has-diff.txt)" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.pr.outputs.has_diff == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.pr.outputs.number }}
          path: warning-diff-comment/warning-diff-comment.md

      # A later push no longer changes any warnings: mark the earlier comment
      # outdated instead of leaving stale content on the PR.
      - name: Hide stale PR comment
        if: steps.pr.outputs.has_diff != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.pr.outputs.number }}
          hide: true
          hide_classify: OUTDATED
